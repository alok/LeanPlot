name = "LeanPlot"
version = "0.2.0"
description = "Plotting for Lean 4: a zero-dependency figure/layout core with deterministic SVG and anti-aliased PNG backends"
keywords = ["plotting", "visualization", "svg", "png"]
license = "Apache-2.0"
defaultTargets = ["LeanPlot", "leanplottest"]
testDriver = "leanplottest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[lean_lib]]
name = "LeanPlot"

[[lean_lib]]
name = "LeanPlotTest"

[[lean_exe]]
name = "leanplottest"
root = "LeanPlotTest.Main"
